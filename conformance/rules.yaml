    - "tests/unit/test_e4_f44_imports.py::test_not_an_embed_stays_literal_and_is_never_read"
  fixtures: ["a-lex-escaped-directive-literal"]

LEX-PARSE-BEFORE-EXPAND:
  spec: "extended-markdown §2"
  text: "Implementations MUST parse Markdown structure before expanding inline directives; global regular-expression replacement is not conforming."
  tests:
    - "tests/unit/test_e3_f32_blocks.py::test_directive_split_across_a_code_span_is_not_a_directive"
    - "tests/unit/test_e3_f32_blocks.py::test_scan_ignores_code_html_and_escapes_at_any_depth"
  fixtures: ["a-lex-code-span-structure-first"]

LEX-PATH-NO-ROOT-ESCAPE:
  spec: "extended-markdown §2"
  text: "A path MUST NOT escape the authorised root after canonicalisation."
  tests:

  fixtures: ["a-lex-inline-code-literal"]

LEX-NO-DIRECTIVE-IN-HTML-BLOCK:
  spec: "extended-markdown §2"
  text: "MDQ directives MUST NOT be interpreted inside raw HTML blocks."
  tests:
    - "tests/unit/test_e3_f32_blocks.py::test_scan_ignores_code_html_and_escapes_at_any_depth"

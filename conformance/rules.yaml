  fixtures: ["a-lex-html-block-literal"]

LEX-NO-DIRECTIVE-ESCAPED:
  spec: "extended-markdown §2"
  text: "MDQ directives MUST NOT be interpreted inside escaped sequences (a backslash before an opening delimiter escapes it)."
  tests:

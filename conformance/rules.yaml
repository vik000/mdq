ANCH-BLOCK-ID-PRIORITY:
  spec: "extended-markdown §3.1"
  text: "A user-authored block ID has priority as its own anchor and MUST NOT collide with another generated ID."
  fixtures: ["a-anch-block-id-reserves-its-anchor"]

ANCH-GENERATED-COLLISION-RENAME:

  fixtures: ["a-anch-portable-slug"]

ANCH-ABSENT-TARGET-NO-BROKEN-ANCHOR:
  spec: "extended-markdown §3.1"
  text: "If a source target is absent from the output, the exporter MUST emit a working link to a separately exported file or fail with MDQ_UNRESOLVED_REFERENCE; it MUST NOT generate a broken anchor."
  fixtures: ["a-comp-ref-link-unresolved-heading-fails"]

ANCH-EXPORT-REWRITE-DESTINATIONS:
  spec: "extended-markdown §3.1"
  text: "When exporting to a different directory or a single-file format, the exporter MUST rewrite destinations or copy/inline assets to keep links valid."
  tests:

    - "tests/unit/test_e4_f41_paths.py::test_absolute_and_scheme_are_denied"
  fixtures: ["a-lex-path-traversal-denied"]

LEX-PATH-NO-SYMLINK-ESCAPE:
  spec: "extended-markdown §2"
  text: "A path MUST NOT escape the authorised root ... including through symlinks."
  tests:
    - "tests/unit/test_e4_f41_paths.py::test_symlink_escape_is_denied"
    - "tests/unit/test_e4_f41_paths.py::test_broken_and_looping_symlinks"

COMP-BLOCK-ID-SYNTAX:
  spec: "extended-markdown §3"
  text: "IDs match [A-Za-z][A-Za-z0-9_-]*."
  tests:

  fixtures: ["a-comp-import-cycle-two-files"]

COMP-IMPORT-CYCLE-SECTION:
  spec: "extended-markdown §3"
  text: "Import cycle detection MUST include section imports."
  tests:
    - "tests/unit/test_e4_f44_imports.py::test_section_that_contains_its_own_import_is_a_cycle"
    - "tests/unit/test_e4_f44_imports.py::test_whole_file_importing_its_section_that_imports_the_file_is_a_cycle"
  fixtures: ["a-comp-import-cycle-section"]

COMP-REF-LINK-REWRITE:
  spec: "extended-markdown §3"
  text: "A link generated by a reference MUST be rewritten to point to the compiled target when available."
  fixtures: ["a-core-build-wiki-link-not-left-literal"]

COMP-REF-LINK-FALLBACK-OR-FAIL:
  spec: "extended-markdown §3"
  text: "Otherwise it MUST remain a valid relative Markdown link to a copied dependency or fail with MDQ_UNRESOLVED_REFERENCE."
  fixtures: ["a-comp-ref-link-unresolved-heading-fails"]

ANCH-COMBINED-DUPLICATE-DISAMBIGUATE:

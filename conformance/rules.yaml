  fixtures: ["a-anch-import-asset-rebased"]

ANCH-HTML-EXPORT-LINKS:
  spec: "extended-markdown §3.1"
  text: "For HTML export, Markdown links MUST point to generated HTML paths and HTML anchors, not raw .md targets."
  na: "the library has no HTML exporter (Markdown export only)"

CORE-NORMATIVE-SCOPE:
  spec: "extended-markdown §3.2"
  text: "Sections explicitly marked normative, and all unqualified MUST/MUST NOT/SHOULD/MAY requirements, define conformance."
  na: "statement about the spec document itself"

CORE-EXAMPLE-CORRECTION:
  spec: "extended-markdown §3.2"
  text: "Where an example conflicts with a normative rule, the normative rule prevails and the example MUST be corrected."
  na: "obligation on the spec editors, not the library"


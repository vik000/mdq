# MDQ rule ledger (TEST_PLAN 3.5, G56). One entry per normative MUST / MUST NOT of spec/ (and the age SHOULD).
# Keys: spec (file + section), text (the requirement), tests (pytest node IDs without parameters),
# fixtures (conformance/cases/*.json ids), or na (why the rule cannot apply to this library).
# Checked by tests/conformance/test_rule_ledger.py; strings are quoted one-liners (the loader is strict).

ENC-UTF8-REJECT-MALFORMED:
  spec: "extended-markdown header"
  text: "Encoding: UTF-8; input MUST reject malformed UTF-8."
  tests:
    - "tests/unit/test_e3_f31_utf8.py::test_malformed_is_rejected_with_offset"
    - "tests/unit/test_e3_f31_utf8.py::test_random_bytes_match_python"

CORE-NORMATIVE-TERMS:
  spec: "extended-markdown §1"
  text: "The terms MUST, MUST NOT, SHOULD and MAY are normative."
  na: "statement about how the spec document is read, not a behaviour of the library"

CORE-PLAIN-MD-VALID:
  spec: "extended-markdown §1"
  text: "A plain .md file without MDQ directives MUST remain valid input."
  tests:
    - "tests/unit/test_e8_f81a_compile.py::test_plain_markdown_passes_through"
    - "tests/unit/test_e5_f54_export.py::test_plain_markdown_passes_through_byte_identical"
    - "tests/unit/test_e3_f32_blocks.py::test_documents_without_directives_are_unchanged"
  fixtures: ["a-core-plain-md-unchanged"]

CORE-COMMONMARK-SEMANTICS:
  spec: "extended-markdown §1"
  text: "MDQ processors MUST preserve ordinary CommonMark semantics."
  tests:
    - "tests/unit/test_e3_f32_blocks.py::test_blocks_match_markdown_it"
    - "tests/unit/test_e3_f32_blocks.py::test_curated_documents_match_markdown_it"
    - "tests/unit/test_e4_f45_links.py::test_rebased_text_renders_the_same_links"
  fixtures: ["a-core-plain-md-unchanged", "a-core-gfm-constructs-kept"]

CORE-BUILD-NO-UNRESOLVED-DIRECTIVES:
  spec: "extended-markdown §1"
  text: "mdq build MUST produce standard Markdown without unresolved MDQ directives."
  tests:
    - "tests/unit/test_e5_f54_export.py::test_unevaluated_variable_fails"
    - "tests/unit/test_e5_f54_export.py::test_unexpanded_embed_fails"
    - "tests/unit/test_e8_f81a_compile.py::test_block_ids_are_removed"
  fixtures: ["a-core-build-strips-block-ids", "a-core-build-wiki-link-not-left-literal"]

CORE-PUBLISH-PROFILES:
  spec: "extended-markdown §1"
  text: "A conforming implementation MUST publish supported feature profiles."
  tests:
    - "tests/unit/test_e0_f01_versions.py::TestGeneral::test_supported_profiles_are_known_and_unique"
    - "tests/unit/test_e8_f81a_compile.py::test_all_profiles_supported"
  fixtures: ["a-core-all-profiles-accepted"]

CORE-UNSUPPORTED-FEATURE-FAILS:
  spec: "extended-markdown §1"
  text: "Unsupported required features MUST fail rather than silently disappear."
  tests:
    - "tests/unit/test_e0_f01_versions.py::TestNegative::test_unknown_profile_names_the_profile"
    - "tests/unit/test_e8_f81a_compile.py::test_version_and_features"
    - "tests/unit/test_e5_f54_export.py::test_unknown_required_containers_fail"
  fixtures: ["a-core-unknown-feature-fails", "a-core-unknown-required-container-fails"]

RICH-PORTABLE-EXPORT-SPECIFIED:
  spec: "extended-markdown §1"
  text: "Rich features ... may require a rendering adapter; their portable export MUST be specified."
  na: "obligation on the specification text (it must define the fallbacks), not on the library; the fallbacks themselves are covered by the RICH-* rules"

LEX-NO-DIRECTIVE-IN-FENCED-CODE:
  spec: "extended-markdown §2"
  text: "MDQ directives MUST NOT be interpreted inside fenced code."
  tests:
    - "tests/unit/test_e3_f32_blocks.py::test_scan_ignores_code_html_and_escapes_at_any_depth"
    - "tests/unit/test_e4_f44_imports.py::test_not_an_embed_stays_literal_and_is_never_read"
  fixtures: ["a-lex-fenced-code-literal"]

LEX-NO-DIRECTIVE-IN-INDENTED-CODE:
  spec: "extended-markdown §2"
  text: "MDQ directives MUST NOT be interpreted inside indented code."
  tests:
    - "tests/unit/test_e3_f32_blocks.py::test_scan_ignores_code_html_and_escapes_at_any_depth"
    - "tests/unit/test_e4_f44_imports.py::test_not_an_embed_stays_literal_and_is_never_read"
  fixtures: ["a-lex-indented-code-literal"]

LEX-NO-DIRECTIVE-IN-INLINE-CODE:
  spec: "extended-markdown §2"
  text: "MDQ directives MUST NOT be interpreted inside inline code."
  tests:

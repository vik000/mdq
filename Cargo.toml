[workspace]
resolver = "2"
members = ["crates/mdq-core", "crates/mdq-python"]

[workspace.package]
# Single source of truth for the version: maturin reads it for the Python wheel too.
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Do NOT set `panic = "abort"`: PyO3 relies on unwinding to turn a Rust panic
# into a Python exception instead of killing the interpreter.
[profile.release]
opt-level = 3

# Optimise dependencies even in dev builds (`maturin develop`): scrypt and X25519 are far too slow
# unoptimised. Our own crates stay at the normal dev settings (fast compiles, debug checks).
[profile.dev.package."*"]
opt-level = 3

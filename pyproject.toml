[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mdq"
description = "MDQ: extended Markdown processor (Rust core, Python API)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dynamic = ["version"]   # taken from the Rust workspace version

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6", "markdown-it-py>=3", "linkify-it-py>=2", "pyrage>=1.1", "mypy>=1.10"]

[tool.maturin]
manifest-path = "crates/mdq-python/Cargo.toml"
python-source = "python"
module-name = "mdq._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "spec(ref): spec section the test covers, e.g. 'extended-markdown §8.5'",
  "rule(id): rule-ledger ID the test covers",
  "unit: tests of internal functions",
  "conformance: end-to-end fixture tests",
  "property: Hypothesis property tests",
  "differential: comparison against an independent Python oracle",
  "security: hostile-input tests",
  "slow: long-running tests",
  "gap: depends on an open spec gap (use with xfail strict)",
]

[tool.mypy]
strict = true
files = ["python/mdq"]

# Unstable, deliberately untyped test hooks (re-exports of the compiled module).
[[tool.mypy.overrides]]
module = "mdq._internal"
ignore_errors = true
